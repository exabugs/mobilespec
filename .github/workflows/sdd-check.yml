name: sdd-check

# 利用側のリポジトリから呼び出す再利用ワークフロー。
# 利用側のリポジトリをチェックアウトし、公開済みの @exabugs/mobilespec を使って仕様を検証する。
#
# 使い方（利用側）:
#   jobs:
#     sdd:
#       uses: exabugs/mobilespec/.github/workflows/sdd-check.yml@main
#       with:
#         specs_dir: specs/mobile
#         openapi_path: docs/specs/openapi.bundled.yaml   # 任意（リポジトリのルートからの相対パス）

on:
  workflow_call:
    inputs:
      specs_dir:
        description: 'L2.screenflows / L3.ui / L4.state を含む仕様ディレクトリ（リポジトリのルートからの相対パス）'
        type: string
        required: true

      mobilespec_version:
        description: '使う @exabugs/mobilespec のバージョン（例: 2.0.0 / 2）。既定は 2（2.x の最新）。1.x の仕様（mobilespec.config.yml）のままなら 1.1.8 に固定すること'
        type: string
        required: false
        default: '2'

      schema_dir:
        description: 'スキーマのディレクトリ。空なら、パッケージ同梱のスキーマを使う'
        type: string
        required: false
        default: ''

      openapi_path:
        description: 'OpenAPI（bundled）のパス。リポジトリのルートからの相対パス。空なら app.yaml の openapi を使う'
        type: string
        required: false
        default: ''

      verbose:
        description: 'i18n の診断を集計せず、全件表示する'
        type: boolean
        required: false
        default: false

      # --- 以下は後方互換のために残している（効果なし）。warning は存在しない方針のため ---
      fail_on_warnings:
        description: '廃止（効果なし）'
        type: boolean
        required: false
        default: true

      upload_artifacts:
        description: 'check は生成物を作らないため、通常は不要'
        type: boolean
        required: false
        default: false

      artifact_name:
        type: string
        required: false
        default: sdd-generated

      include_hidden_files:
        type: boolean
        required: false
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 検証（read-only。ファイルは生成・更新しない）。error が 1 件でもあれば失敗する
      - name: mobilespec check
        env:
          SPECS_DIR: ${{ inputs.specs_dir }}
          SCHEMA_DIR: ${{ inputs.schema_dir }}
          VERSION: ${{ inputs.mobilespec_version }}
          VERBOSE: ${{ inputs.verbose }}
          OPENAPI: ${{ inputs.openapi_path }}
        run: |
          args=(check --specs-dir "$SPECS_DIR")
          if [ -n "$OPENAPI" ]; then args+=(--openapi "$OPENAPI"); fi
          if [ -n "$SCHEMA_DIR" ]; then args+=(--schema-dir "$SCHEMA_DIR"); fi
          if [ "$VERBOSE" = "true" ]; then args+=(--verbose); fi
          npx -y "@exabugs/mobilespec@$VERSION" "${args[@]}"

      # 生成物（ja.json・索引・遷移図）が最新か（read-only）
      - name: mobilespec update --check
        env:
          SPECS_DIR: ${{ inputs.specs_dir }}
          VERSION: ${{ inputs.mobilespec_version }}
        run: npx -y "@exabugs/mobilespec@$VERSION" update --check --specs-dir "$SPECS_DIR"

      - name: upload artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          include-hidden-files: ${{ inputs.include_hidden_files }}
          path: |
            ${{ inputs.specs_dir }}/**/*.md
            ${{ inputs.specs_dir }}/**/i18n/**/*
